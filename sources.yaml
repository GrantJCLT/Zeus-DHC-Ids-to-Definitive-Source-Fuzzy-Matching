# Zeus <-> Definitive identifier verification - source configuration
#
# Regenerate the "definitive:" blocks for any new export with:
#     python dhc_match_v2.py inspect <export.xlsx>
# then paste the detected roles here and sanity-check them.
#
# Run with:
#     python dhc_match_v2.py run --config sources.yaml --out audit_2026_08

zeus:
  # Zeus is read live from the failover replica. Every query excludes entities
  # created by a Definitive import (the EntityDescription filter), which removes
  # ~95.6% of identifier-carrying rows - so counts here are NOT comparable to
  # any run before 2026-07-31.
  #
  # SIX populations, one query each, each reading its own *Info table and so its
  # own column names. 6,902 of 12,810 entities carry more than one flag, e.g.
  # both IsClient and IsWorkLocation. Those are not duplicates: each Info table
  # holds a different name and address for the same entity. They are POOLED -
  # one scored row per EntityId, with every name and address from every
  # population it belongs to as a candidate, best match wins. `Zeus_Sources`
  # records which populations contributed.
  sources:
    - label: Client
      query_file: Zeus Client to Definitive ID data quality evaluation.sql
      name: [ClientEntityName, ClientInfoName]
      address: [ClientAddress1, ClientAddress2, ClientAddress3]
      city: ClientCity
      state: ClientState
      zip: ClientZip

    - label: WorkLocation
      query_file: Zeus Work Location to Definitive ID data quality evaluation.sql
      name: [WorkLocationEntityName, WorkLocationInfoName]
      address: [WorkLocationAddress1, WorkLocationAddress2, WorkLocationAddress3]
      city: WorkLocationCity
      state: WorkLocationState
      zip: WorkLocationZip

    - label: HealthSystem
      query_file: Zeus HealthSystem to Definitive ID data quality evaluation.sql
      name: [HealthSystemEntityName, HealthSystemInfoName]
      address: [HealthSystemAddress1, HealthSystemAddress2, HealthSystemAddress3]
      city: HealthSystemCity
      state: HealthSystemState
      zip: HealthSystemZip

    - label: GPO
      query_file: Zeus GPO to Definitive ID data quality evaluation.sql
      name: [GPOEntityName, GPOInfoName]
      address: [GPOAddress1, GPOAddress2, GPOAddress3]
      city: GPOCity
      state: GPOState
      zip: GPOZip

    - label: Agency
      query_file: Zeus Agency to Definitive ID data quality evaluation.sql
      name: [AgencyEntityName, AgencyName]
      address: [AgencyAddress1, AgencyAddress2, AgencyAddress3]
      city: AgencyCity
      state: AgencyState
      zip: AgencyZip

    - label: VMS
      query_file: Zeus VMS to Definitive ID data quality evaluation.sql
      name: [VMSEntityName, VMSInfoName]
      address: [VMSAddress1, VMSAddress2, VMSAddress3]
      city: VMSCity
      state: VMSState
      zip: VMSZip

  connection:
    driver: ODBC Driver 18 for SQL Server
    host: prd-jcl-zeus-failover.ff2d73e4c70e.database.windows.net
    port: 1433
    database: Zeus
    user: JCBIReportUser
    # The secret is never stored here. Set the environment variable instead.
    password_env: ZEUS_SQL_PASSWORD
    encrypt: true
    trust_server_certificate: true
    # Mandatory: the host is a failover-group listener, and reaching the
    # readable secondary requires the intent to be declared explicitly.
    application_intent: ReadOnly
    multi_subnet_failover: true

  # An archived extract can replace the live queries for an offline re-run.
  # Point `path:` at a <prefix>_zeus_extract.csv - it holds the canonical union
  # (one row per population per entity) and is pooled the same way on load.
  # path: audit_2026_08_zeus_extract.csv

  key: EntityId                     # one scored row per EntityId after pooling
  # Tried in order; the first non-null wins. Where both are populated and
  # disagree the row is flagged in DHC_Id_Conflict. Both live on dbo.Entity /
  # LinkEntityVerifiedSource, so they are the same for every population.
  id_columns:
    - Entity_DHC_VerifiedSourceId
    - LEVS_DHC_VerifiedSourceId

# ---------------------------------------------------------------------------
# IDENTITY sources: one row per Definitive entity. These decide what an id IS.
#
# Definitive ids share a single namespace across entity types, so stacking
# these widens the testable population without collisions - verified, the three
# sets below share no ids at all. All four exports were re-cut on 2026-07-31 to
# a common `DefinitiveId` key; the older HospitalId / HOSPITAL_ID column names
# are gone.
# ---------------------------------------------------------------------------
definitive:
  - path: Definitive_HospitalOverview.xlsx
    entity_type: Hospital
    id: DefinitiveId
    name: Name
    address: [AddressHq, Address1Hq]
    city: HqCity
    state: HqState
    zip: HqZipCode

  - path: Definitive_PhysicianGroupOverview.xlsx
    entity_type: PhysicianGroup
    id: DefinitiveId
    name: Definitive_NAME
    address: [HQ_ADDRESS, HQ_ADDRESS1]
    city: HQ_CITY
    state: HQ_STATE
    zip: HQ_ZIP_CODE

  - path: Definitive_GPO_Overview.xlsx
    entity_type: GPO
    id: DefinitiveId
    name: Name
    address: [HeadquartersAddress, HeadquartersAddress1]
    city: HeadquartersCity
    state: HeadquartersState
    zip: HeadquartersZipCode

# ---------------------------------------------------------------------------
# LOCATION sources: MANY rows per Definitive id - one per service location.
#
# Do NOT list these under `definitive:`. The id is the parent entity's, not the
# location's (399,990 rows, 176,658 distinct ids, one id has 962 locations), so
# stacking them as identity would let an arbitrary location overwrite the
# authoritative name and HQ for 122,539 ids.
#
# Used instead to enrich the entity they belong to: every location address,
# city, state and zip becomes a candidate for the address comparison, and every
# location name becomes a name alias. This is the fix for the HQ-vs-service-
# location gap that decision #4 exists to work around.
#
# Ids that appear ONLY here (54,119) still become testable, using their first
# location row as identity, tagged entity_type PracticeLocation.
# ---------------------------------------------------------------------------
locations:
  - path: Definitive_Practice_Locations.xlsx
    id: DefinitiveId
    name: Name
    address: [HeadquartersAddress, HeadquartersAddress1]
    city: HeadquartersCity
    state: HeadquartersState
    zip: HeadquartersZipCode
