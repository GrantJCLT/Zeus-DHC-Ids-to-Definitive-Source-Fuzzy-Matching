# Zeus <-> Definitive identifier verification - source configuration
#
# Regenerate the "definitive:" blocks for any new export with:
#     python dhc_match_v2.py inspect <export.xlsx>
# then paste the detected roles here and sanity-check them.
#
# Run with:
#     python dhc_match_v2.py run --config sources.yaml --out audit_2026_08

zeus:
  # Zeus is read live from the failover replica. Every query excludes entities
  # created by a Definitive import (the EntityDescription filter), which removes
  # ~95.6% of identifier-carrying rows - so counts here are NOT comparable to
  # any run before 2026-07-31.
  #
  # Each population has TWO queries against the same rows and the same columns:
  # `query_file` selects the entities that carry a Definitive id (the accuracy
  # audit, dhc_match_v2.py) and `gap_query_file` selects those that carry none
  # (the coverage audit, dhc_gap_match.py). They partition one universe, so
  # their entity counts add to the whole - 12,803 + 48,739 measured 2026-08-19.
  # The role mappings below serve both; only the query differs.
  #
  # SIX populations, one query each, each reading its own *Info table and so its
  # own column names. 6,902 of 12,810 entities carry more than one flag, e.g.
  # both IsClient and IsWorkLocation. Those are not duplicates: each Info table
  # holds a different name and address for the same entity. They are POOLED -
  # one scored row per EntityId, with every name and address from every
  # population it belongs to as a candidate, best match wins. `Zeus_Sources`
  # records which populations contributed.
  sources:
    - label: Client
      query_file: Zeus Client to Definitive ID data quality evaluation.sql
      gap_query_file: Zeus Client missing Definitive ID.sql
      name: [ClientEntityName, ClientInfoName]
      address: [ClientAddress1, ClientAddress2, ClientAddress3]
      city: ClientCity
      state: ClientState
      zip: ClientZip

    - label: WorkLocation
      query_file: Zeus Work Location to Definitive ID data quality evaluation.sql
      gap_query_file: Zeus Work Location missing Definitive ID.sql
      name: [WorkLocationEntityName, WorkLocationInfoName]
      address: [WorkLocationAddress1, WorkLocationAddress2, WorkLocationAddress3]
      city: WorkLocationCity
      state: WorkLocationState
      zip: WorkLocationZip

    - label: HealthSystem
      query_file: Zeus HealthSystem to Definitive ID data quality evaluation.sql
      gap_query_file: Zeus HealthSystem missing Definitive ID.sql
      name: [HealthSystemEntityName, HealthSystemInfoName]
      address: [HealthSystemAddress1, HealthSystemAddress2, HealthSystemAddress3]
      city: HealthSystemCity
      state: HealthSystemState
      zip: HealthSystemZip

    - label: GPO
      query_file: Zeus GPO to Definitive ID data quality evaluation.sql
      gap_query_file: Zeus GPO missing Definitive ID.sql
      name: [GPOEntityName, GPOInfoName]
      address: [GPOAddress1, GPOAddress2, GPOAddress3]
      city: GPOCity
      state: GPOState
      zip: GPOZip

    - label: Agency
      query_file: Zeus Agency to Definitive ID data quality evaluation.sql
      gap_query_file: Zeus Agency missing Definitive ID.sql
      name: [AgencyEntityName, AgencyName]
      address: [AgencyAddress1, AgencyAddress2, AgencyAddress3]
      city: AgencyCity
      state: AgencyState
      zip: AgencyZip

    - label: VMS
      query_file: Zeus VMS to Definitive ID data quality evaluation.sql
      gap_query_file: Zeus VMS missing Definitive ID.sql
      name: [VMSEntityName, VMSInfoName]
      address: [VMSAddress1, VMSAddress2, VMSAddress3]
      city: VMSCity
      state: VMSState
      zip: VMSZip

  connection:
    driver: ODBC Driver 18 for SQL Server
    host: prd-jcl-zeus-failover.ff2d73e4c70e.database.windows.net
    port: 1433
    database: Zeus
    user: JCBIReportUser
    # The secret is never stored here. Set the environment variable instead.
    password_env: ZEUS_SQL_PASSWORD
    encrypt: true
    trust_server_certificate: true
    # Mandatory: the host is a failover-group listener, and reaching the
    # readable secondary requires the intent to be declared explicitly.
    application_intent: ReadOnly
    multi_subnet_failover: true

  # An archived extract can replace the live queries for an offline re-run.
  # Point `path:` at a <prefix>_zeus_extract.csv - it holds the canonical union
  # (one row per population per entity) and is pooled the same way on load.
  # path: audit_2026_08_zeus_extract.csv

  # Phone numbers for all six populations, one query. Its Zeus_Source labels
  # must equal the `label:` values above. Phones are a third signal beside name
  # and address (Phone_Match); they never change Verdict or Match_Tier.
  phone_query_file: Zeus entity phones.sql

  # The HealthSystem > Client > WorkLocation hierarchy (zeus_hierarchy.py only;
  # the audits never read these). The links query is every active
  # WorkLocation -> Client and Client -> HealthSystem link; the import query is
  # every Definitive-import-created entity on either end of one, since those
  # become hierarchy nodes wherever an in-scope entity links to them; the
  # duplicates query is every entity marked DuplicateOfId another.
  hierarchy_query_file: Zeus hierarchy links.sql
  linked_import_query_file: Zeus linked import entities.sql
  duplicates_query_file: Zeus entity duplicates.sql

  key: EntityId                     # one scored row per EntityId after pooling
  # Tried in order; the first non-null wins. Where both are populated and
  # disagree the row is flagged in DHC_Id_Conflict. Both live on dbo.Entity /
  # LinkEntityVerifiedSource, so they are the same for every population.
  id_columns:
    - Entity_DHC_VerifiedSourceId
    - LEVS_DHC_VerifiedSourceId

# ---------------------------------------------------------------------------
# IDENTITY sources: one row per Definitive entity. These decide what an id IS.
#
# Definitive ids share a single namespace across entity types, so stacking
# these widens the testable population without collisions - verified, the three
# sets below share no ids at all.
#
# A block names ONE of:
#   path:        a local export (xlsx / csv)
#   query_file:  a Databricks SQL file, run as written; needs `snapshot:`
#   table:       a Unity Catalog table or view - shorthand for a SELECT of the
#                role columns
# The last two read through the `databricks:` connection. Databricks is live,
# so each run writes a <run>_dhc_<snapshot>.parquet snapshot (plus the SQL that
# produced it, as .sql) and scores that; keep both with the run outputs, like
# the Zeus extract. A query's output columns must match the roles below. Column
# names are the
# table's own: the xlsx exports were re-cut on 2026-07-31 to a common
# `DefinitiveId` key, but the Databricks tables keep their original names
# (hospitaloverview: HospitalId, HospitalName).
# ---------------------------------------------------------------------------
databricks:
  host: https://adb-8032826808193104.4.azuredatabricks.net
  # OAuth login held by the CLI: `databricks auth login --profile jcl`.
  profile: jcl
  warehouse_id: 5941bfd954019dc3    # qat-eus-jcl-Databricks-W-M

definitive:
  - query_file: Definitive Hospital Overview.sql
    snapshot: hospitaloverview        # <run>_dhc_hospitaloverview.parquet
    entity_type: Hospital
    id: HospitalId
    name: HospitalName
    address: [AddressHq, Address1Hq]
    city: HqCity
    state: HqState
    zip: HqZipCode
    phone: PhoneHq

  - query_file: Definitive Physician Group Overview.sql
    snapshot: physiciangroupsoverview
    entity_type: PhysicianGroup
    id: HospitalId                    # the practice's own id, not a parent
    name: HospitalName
    address: [HeadquartersAddress, HeadquartersAddress1]
    city: HeadquartersCity
    state: HeadquartersState
    zip: HeadquartersZipCode
    phone: HeadquartersPhone

  - query_file: Definitive GPO Overview.sql
    snapshot: gpooverview
    entity_type: GPO
    id: HospitalId
    name: HospitalName
    address: [HeadquartersAddress, HeadquartersAddress1]
    city: HeadquartersCity
    state: HeadquartersState
    zip: HeadquartersZipCode
    phone: HeadquartersPhone

# ---------------------------------------------------------------------------
# LOCATION sources: MANY rows per Definitive id - one per service location.
#
# Do NOT list these under `definitive:`. The id is the parent entity's, not the
# location's (399,990 rows, 176,658 distinct ids, one id has 962 locations), so
# stacking them as identity would let an arbitrary location overwrite the
# authoritative name and HQ for 122,539 ids.
#
# Used instead to enrich the entity they belong to: every location address,
# city, state and zip becomes a candidate for the address comparison, and every
# location name becomes a name alias. This is the fix for the HQ-vs-service-
# location gap that decision #4 exists to work around.
#
# Ids that appear ONLY here (54,119) still become testable, using their first
# location row as identity, tagged entity_type PracticeLocation.
# ---------------------------------------------------------------------------
locations:
  # The view is one row per physician per location; the query's DISTINCT and
  # IS NOT NULL are what make it one row per location of a known parent.
  - query_file: Definitive Practice Locations.sql
    snapshot: practicelocations
    id: PracticeLocationHospitalId    # the PARENT entity's id
    name: Location
    address: [HeadquartersAddress, HeadquartersAddress1]
    city: HeadquartersCity
    state: HeadquartersState
    zip: HeadquartersZipCode
    phone: Phones                     # '|'-joined, see the query

# ---------------------------------------------------------------------------
# HIERARCHY sources: read by dhc_hierarchy.py only, never by the two audits.
#
# One block per Definitive view, unioned into one tree. Hospital Overview was
# the only source by rule from 2026-09-30; physician groups were added on
# 2026-10-07 for the Zeus HealthSystem > Client > WorkLocation hierarchy
# (zeus_hierarchy.py), which needs a parent for every id a Zeus entity can
# resolve to. Every query emits the same columns, and the same parent rule -
# SfParentAccountId, else IdNetwork, else HospitalId (a root) - lives in each
# query as ParentId and Parent_Rule. Ids do not overlap between the views; a
# run stops if they ever do. Snapshotted per run like the blocks above.
# ---------------------------------------------------------------------------
hierarchy:
  - query_file: Definitive Hospital Hierarchy.sql
    snapshot: hospitalhierarchy       # <run>_dhc_hospitalhierarchy.parquet
    id: HospitalId
    name: HospitalName

  - query_file: Definitive Physician Group Hierarchy.sql
    snapshot: physiciangrouphierarchy # <run>_dhc_physiciangrouphierarchy.parquet
    id: HospitalId
    name: HospitalName

# ---------------------------------------------------------------------------
# MIGRATION readiness: read by zeus_hierarchy.py only (2026-10-07).
#
# The migration team's ready_for_migration flag from qat_gold.crmmig_rules
# (healthsystem_summary, client_summary, worklocation_summary), one row per
# Zeus EntityId per table. Queried once per run and snapshotted as
# <run>_migration_readiness.parquet / .sql; --migration-from replays it.
# ---------------------------------------------------------------------------
migration:
  query_file: Zeus migration readiness.sql
